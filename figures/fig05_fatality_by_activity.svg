<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Frequent Activities Are Not Necessarily the Most Fatal">
<rect x="0" y="0" width="1600" height="900" fill="#031722"/>
<text x="80" y="48" fill="#f2f7f8" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" dominant-baseline="hanging" text-anchor="start">Frequent Activities Are Not Necessarily the Most Fatal</text>
