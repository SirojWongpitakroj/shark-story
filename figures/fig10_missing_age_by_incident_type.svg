<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Missing Information Is Not Evenly Distributed">
<rect x="0" y="0" width="1600" height="900" fill="#031722"/>
